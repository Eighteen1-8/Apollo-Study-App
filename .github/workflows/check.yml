# Types, build, unit tests, backend tests and the smoke run, on Windows (the app's only platform). The smoke run
# uses a fake model server (app/tests/e2e/fake_llm.py), so no model or key is needed.
name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
        working-directory: backend
      - run: npm ci
        working-directory: app
      - run: npm run check
        working-directory: app
